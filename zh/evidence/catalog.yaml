sources:
  - id: SRC-APPLICANT
    kind: applicant_account
    locator: "关于成绩、微观答疑及朋辈辅导的本人聊天记录"
    scope: "本人陈述，具体细节按需核对。"
  - id: SRC-PLAN
    kind: design_note
    locator: "已认可的方案文件《粘贴的文本 (1).txt》，2026-11-21。"
    scope: "用于方案和冲突线索，引用到的原始材料可能仍待核对。"
  - id: SRC-CV
    kind: applicant_cv
    locator: "CV of Jiacheng Bie.docx，原件另存，2026-11-21 已读。"
    scope: "本人对实习及研究的陈述，成绩及研究结果另按原始记录核对。"
  - id: SRC-ADVISOR
    kind: applicant_prepared_packet
    locator: "Advisor Packet(PS&CV)(1).docx，原件另存，2026-11-21 已读。"
    scope: "申请人准备的工作稿。推荐人直接观察或作出的评价需另证。"
  - id: SRC-CORNELL-PS
    kind: application_draft
    locator: "Cornell MPS AEM Personal Statement(1).docx，2026-11-21 已读。"
    scope: "提供候选场景及表述，作者归属和具体事实可能仍需确认。"
  - id: SRC-CORNELL-SOP
    kind: application_draft
    locator: "Cornell MPS AEM Statement of Purpose(1).docx，2026-11-21 已读。"
    scope: "用于定位草稿表述。须核对因果措辞与项目特定主张。"
  - id: SRC-TRANSCRIPT-REFERENCE
    kind: official_transcript_reference
    locator: "此前提供的曼彻斯特大学阶段性成绩单，日期为 2026-10-07。"
    scope: "直接查阅时属于官方记录。本次整理未重读原件。"
  - id: SRC-ETF-REPO
    kind: project_repository
    locator: "https://github.com/luka77bie/narrative-aware-etf-rotation"
    scope: "2026-11-21 已核对项目说明及四折滚动样本外汇总结果。本人查看结果时的先后顺序仍待证实。"
  - id: SRC-DASHBOARD
    kind: project_repository
    locator: "https://github.com/luka77bie/portfolio-risk-dashboard"
    scope: "已定位项目，个人分工和人工智能辅助实现细节待查。"
  - id: SRC-PLAN-GRAD
    kind: owner_selected_design_note
    locator: "《粘贴的文本 (1)(1).txt》，2026-11-21，原件另存。"
    scope: "第二版方案。间接引述问卷等材料的内容，需要直接核对才能列为个人事实。"
  - id: SRC-CHAT-ETF
    kind: applicant_chat_account
    locator: "2026-11-17 关于 ETF 研究假设及行为金融兴趣的聊天。"
    scope: "仅引述本人有记录的说法。精确对话、具体步骤和其他结果仍需相应证据。"
  - id: SRC-CHAT-CFA
    kind: applicant_chat_account
    locator: "2026-10-21 申请准备聊天，本人回忆团队讨论和赛后复盘。"
    scope: "仅引述本人有记录的说法。精确对话、具体步骤和其他结果仍需相应证据。"
  - id: SRC-CHAT-MICRO
    kind: applicant_chat_account
    locator: "2026-10-22 推荐信讨论中确认答疑经历，2026-10-15 另有微观习题答复。"
    scope: "仅引述本人有记录的说法。精确对话、具体步骤和其他结果仍需相应证据。"
  - id: SRC-CHAT-FINANCE
    kind: applicant_chat_account
    locator: "2026-11-19 与 2026-11-21 的金融申请讨论，涉及职业目标、工行单位、净现值及龙升情景输入。"
    scope: "仅引述本人有记录的说法。精确对话、具体步骤和其他结果仍需相应证据。"
  - id: SRC-CHAT-PEER
    kind: applicant_chat_account
    locator: "此前的朋辈辅导聊天中，本人提供了 2026-10-12 已发送重新分配通知的证据。"
    scope: "仅引述本人有记录的说法。精确对话、具体步骤和其他结果仍需相应证据。"
  - id: SRC-UCL-PS
    kind: application_draft
    locator: "UCL MFin Personal Statement.docx，原件另存，2026-11-21 已读。"
    scope: "用于核对结构及草稿中对经历的描述。作者与项目匹配主张待确认。因果表述仍属工作稿措辞。"
  - id: SRC-JHU-ESSAYS
    kind: application_draft
    locator: "JHU Carey Essays(1).docx，2026-11-22 已读，原件保存在公开仓库之外。"
    scope: "两篇必交稿及一篇补充说明。用于核对草稿的措辞、篇幅和选材，篮球经历及各项成果仍待独立核实。"
  - id: SRC-CHAT-BASKETBALL
    kind: applicant_chat_account
    locator: "2026-11-16 与 2026-11-22 关于高中篮球挫折的申请讨论。"
    scope: "本人对队长经历、三分惜败、角色调整、后续比赛和反思的陈述。具体权限、战术及当时反应仍需核对。"
  - id: SRC-CHAT-FITNESS
    kind: applicant_chat_account
    locator: "2026-04-20 与 2026-11-22 关于训练、减重、曼彻斯特半马及 2027 全马准备的讨论。"
    scope: "本人陈述。对外使用比赛信息前核对正式记录，公开资料不加入健康隐私。"
  - id: SRC-CHAT-WRITING
    kind: applicant_preferences
    locator: "2026-10-01、2026-10-23、2026-11-17 与 2026-11-22 的申请写作和面试练习讨论。"
    scope: "本人对简洁、自然、证据充分的写作，以及分阶段英语口语练习的偏好。"
  - id: SRC-CHAT-INTERVIEW
    kind: applicant_chat_account
    locator: "2026-11-22 研究生面试练习。"
    scope: "记录探索性职业表述和口语练习偏好。未核对前不覆盖另行确认的职业重点。"

  - id: SRC-CHAT-GRAD-MOTIVATION
    kind: applicant_chat_account
    locator: "2026-11-22 和 2026-11-25 关于方法训练与协作动机的研究生申请讨论。"
    scope: "本人确认的动机框架。保留两条动机，不把综合表述写成固定句子。"
  - id: SRC-CHAT-BRAZIL
    kind: applicant_chat_account
    locator: "2026-11-25 Cornell 批注复核中的巴西汇率项目讨论。"
    scope: "本人确认的队友提问、文献查阅和条件性解释场景。保持队友匿名。"
  - id: SRC-CHAT-UCL-STRUCTURE
    kind: applicant_chat_account
    locator: "2026-11-22 UCL 个人陈述批注及后续复核。"
    scope: "本人确认的五段结构。Dragon Rise 不是已经确认的第六段。"
  - id: SRC-CHAT-WES
    kind: applicant_chat_account
    locator: "2026-11-25 WES 截图复核。"
    scope: "本人提供的 iGPA Calculator 结果为 3.58/4.00，不是正式认证报告 GPA。"
  - id: SRC-CHAT-HKU
    kind: applicant_chat_account
    locator: "2026-11-25 HKU 补充回答复核。"
    scope: "许多第一人称回答由助手代拟，未经逐项确认不得提升为本人事实。"
  - id: SRC-CHAT-WRITING-LATEST
    kind: applicant_preferences
    locator: "2026-11-25 申请写作反馈以及 Cornell/UCL 复核。"
    scope: "本人确认保留思路、写实际行动和判断、避免套话式总结并使用英式拼写。"
